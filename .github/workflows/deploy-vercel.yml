name: Deploy Rodoletas (Vercel)

# Deploy do frontend (frontend/) pra Vercel a cada push em main — o backend
# (backend/) não roda na Vercel (Rust precisa de processo sempre-ativo, vai
# pro Railway; ver ecommerce/README-TENANCY.md pro mesmo raciocínio já
# aplicado ao motor de e-commerce).
#
# Antes do build, embute ecommerce/frontend sob /loja pra a demo pública
# (/demo → vitrine/admin mockados) funcionar em produção sem localhost.
#
# Setup necessário (uma vez só, feito pelo Pablo, não por este workflow):
#   1. `vercel link` dentro de frontend/ (ou criar o projeto pelo dashboard
#      da Vercel) pra gerar o projectId/orgId.
#   2. Adicionar 3 secrets no repo GitHub (Settings -> Secrets and
#      variables -> Actions): VERCEL_TOKEN (vercel.com/account/tokens),
#      VERCEL_ORG_ID e VERCEL_PROJECT_ID (em frontend/.vercel/project.json
#      depois do `vercel link`, ou no dashboard do projeto na Vercel).
# Sem esses secrets configurados, este workflow falha no passo "vercel
# pull" — isso é esperado até o Pablo configurar, não um bug daqui.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'ecommerce/frontend/**'
      - '.github/workflows/deploy-vercel.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            ecommerce/frontend/package-lock.json
      - name: Embed loja demo under /loja
        run: bash scripts/embed-loja-demo.sh
        working-directory: frontend
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel environment info
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
