name: Supabase keep-alive

# Plano grátis do Supabase pausa o projeto após 7 dias sem atividade.
# Roda 1x por dia (e sob demanda) e faz uma query real no banco.
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query no banco
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "Secret SUPABASE_DB_URL não configurado"; exit 1; }
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "SELECT now() AS ping, (SELECT count(*) FROM loja.tenants) AS tenants;"
