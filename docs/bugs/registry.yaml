- id: BUG-006
  title: "RAG tratado como fonte de dado/fato em vez de referência de estilo de atendimento"
  area: [ai-pipeline]
  service: "assistant-ia (a-vrtek-gente)"
  severity: medium
  status: fixed
  reported_at: "2026-08-17"
  fixed_at: "2026-08-17"
  symptom: >
    Correção explícita do dono da plataforma: RAG não deve ser consultado
    como base de conhecimento factual (preço, produto, disponibilidade) —
    só como exemplo de como a loja costuma atender (tom, estilo). A única
    fonte de dado real deve ser o prompt principal + tool calling.
  root_cause: >
    O texto injetado no prompt da IA 2 rotulava os chunks recuperados
    como "Base de conhecimento da loja (use quando relevante)" — uma
    IA poderia interpretar isso como autorização pra citar dado dali como
    se fosse fato atual.
  fix_commit: "a-vrtek-gente:1730314"
  fix_files: ["a-vrtek-gente/backend/src/agents/pipeline.ts"]
  regression_test_id: null
  manual_verification: >
    Revisão de prompt (não observável via teste HTTP): confirmar que o
    texto injetado antes do RAG diz explicitamente "use APENAS como
    referência de ESTILO" e "PROIBIDO tratar qualquer coisa nesses
    exemplos como dado real".

