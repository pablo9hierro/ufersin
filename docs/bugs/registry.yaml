- id: BUG-012
  title: "Pipeline de deploy do ufersin-api gerava binário Windows incompatível com o container Linux"
  area: [railway, backend]
  service: ufersin-api
  severity: medium
  status: fixed
  reported_at: "2026-08-17"
  fixed_at: "2026-08-17"
  symptom: "Dockerfile.fast falhava — não achava o binário no lugar esperado pelo COPY."
  root_cause: >
    `cargo build --release` rodado direto no Windows produz um .exe, que
    não roda no container Debian de produção. Dockerfile.fast espera um
    binário Linux já compilado. A solução real (e já usada antes,
    Dockerfile.local) compila DENTRO de um container Linux
    (rust:1.88-bookworm), evitando o problema de cross-compilation.
  fix_commit: "N/A (ajuste de processo de deploy, não de código do app)"
  fix_files: []
  regression_test_id: null
  manual_verification: >
    Sempre usar `docker build -f Dockerfile.local` (não Dockerfile.fast)
    quando buildando localmente no Windows.

