# Registro de bugs, quebras e desvios de comportamento — Resolutoo
#
# Fonte de verdade legível por máquina. Cada entrada aqui DEVE ter, se
# severity=critical e status=fixed: um `regression_test_id` que aparece
# literalmente (via grep) em algum teste real dentro de
# ecommerce/frontend/tests/bug-regressions/run.mjs — OU um
# `manual_verification` descrevendo o passo a passo pra checar na mão,
# quando automatizar não é viável (custa dinheiro real de API, precisa de
# fluxo multi-turno de WhatsApp, etc).
#
# scripts/check-bug-coverage.mjs lê este arquivo e falha se algum bug
# crítico e corrigido não tiver NENHUM dos dois — regression_test_id
# grepável ou manual_verification preenchido. Rode via
# `npm run test:bug-coverage` (ecommerce/frontend) — ver docs/bugs/README.md.
#
# Campos:
#   id                  — BUG-NNN, estável, nunca reutilizar depois de criado
#   title               — resumo de uma linha
#   area                — [frontend, backend, database, api, railway, supabase, vercel, evolution-api, ai-pipeline]
#   service             — nome do serviço/repo afetado
#   severity            — critical | high | medium | low
#   status              — fixed | monitoring | wont-fix | open
#   reported_at         — data (YYYY-MM-DD) que o usuário relatou
#   fixed_at            — data do fix, se status=fixed
#   symptom             — o que o usuário observou/relatou (comportamento, não causa)
#   root_cause          — causa técnica real, descoberta por investigação — nunca suposição
#   fix_commit          — hash do commit que corrigiu (repo:hash)
#   fix_files           — arquivos tocados pelo fix
#   regression_test_id  — string exata usada no nome do teste em run.mjs (se automatizado)
#   manual_verification — passo a passo pra verificar na mão (se não automatizado)

- id: BUG-001
  title: "Conectar/desconectar WhatsApp (Evolution API) não funcionava"
  area: [backend, evolution-api, railway]
  service: ecommerce-api
  severity: high
  status: fixed
  reported_at: "2026-08-17"
  fixed_at: "2026-08-17"
  symptom: >
    Botão "Desconectar" em /loja/admin/conta retornava erro cru
    "evolution api returned 500 Internal Server Error: Connection Closed".
    "Gerar novo QR" não gerava QR nenhum mesmo com a instância
    supostamente aberta.
  root_cause: >
    connect() sempre chamava GET /instance/connect direto: se o Evolution
    API ainda achava que a instância estava "open" (mesmo com o socket
    morto), esse endpoint não devolve QR — acha que não precisa
    reconectar. logout() tratava QUALQUER erro do Evolution API (incluindo
    o 500 "Connection Closed" esperado quando o socket já está morto) como
    falha real, mesmo quando o resultado prático desejado (sessão fora do
    ar) já era verdade.
  fix_commit: "ufersin:cfdff74"
  fix_files: ["ecommerce/backend/src/whatsapp.rs"]
  regression_test_id: "BUG-001"
  manual_verification: >
    Em /loja/admin/conta: clicar Desconectar numa sessão já morta não deve
    mostrar erro cru "evolution api returned 500"; clicar Gerar novo QR
    deve sempre tentar logout antes de pedir QR novo.

- id: BUG-002
  title: "Instância Evolution API presa em estado 'open' falso — QR nunca gerava de verdade"
  area: [evolution-api, database, railway]
  service: "Evolution API (Postgres próprio, tabela Instance/Session)"
  severity: high
  status: fixed
  reported_at: "2026-08-17"
  fixed_at: "2026-08-17"
  symptom: >
    Mesmo depois do fix do BUG-001, "Gerar novo QR" continuava sem
    resultado — Evolution API insistia que a instância "loja-resusu"
    estava open, e nenhuma chamada de API (logout, restart, connect)
    mudava isso.
  root_cause: >
    A tabela Instance do Postgres do Evolution API tinha
    connectionStatus='open' desde antes do WhatsApp ter deslogado a
    sessão por fora (evento 401 "Log out instance", visível em
    disconnectionReasonCode/disconnectionObject). O Evolution API nunca
    corrige esse campo sozinho quando o socket morre de forma anormal —
    fica com um estado "zumbi" pra sempre até alguém corrigir direto no
    banco. A tabela Session ainda tinha as credenciais antigas (creds),
    então mesmo um logout bem-sucedido não geraria um QR pra um número
    NOVO, só tentaria reconectar o mesmo número antigo.
  fix_commit: "manual (UPDATE direto no Postgres do Evolution API, sem commit de código)"
  fix_files: []
  regression_test_id: null
  manual_verification: >
    Verificar direto no Postgres do Evolution API: SELECT
    "connectionStatus" FROM "Instance" WHERE name='loja-resusu' deve
    bater com o estado real observado em /loja/admin/conta. Se a loja
    reportar "Conectado" mas mensagens não chegarem/saírem por mais de
    alguns minutos, suspeitar deste mesmo problema de novo.

- id: BUG-003
  title: "Mensagens no /admin/chat só apareciam depois de recarregar a página"
  area: [frontend]
  service: ecommerce/frontend (AdminChat.tsx)
  severity: medium
  status: fixed
  reported_at: "2026-08-17"
  fixed_at: "2026-08-17"
  symptom: >
    Depois de mandar mensagem (via "Novo Chat" ou na caixa de uma
    conversa aberta), nada aparecia na tela até dar F5.
  root_cause: >
    Nenhuma ação de envio disparava um refetch imediato — tudo dependia
    do próximo tick do polling (intervalo de 3s). O useEffect de
    mensagens também dependia do objeto `selected` inteiro (não só do id),
    o que podia reiniciar o polling sem necessidade a cada novo fetch de
    `conversations`.
  fix_commit: "ufersin:37c3530"
  fix_files: ["ecommerce/frontend/src/pages/admin/AdminChat.tsx"]
  regression_test_id: null
  manual_verification: >
    Em /loja/admin/chat: mandar mensagem numa conversa selecionada deve
    aparecer na lista em menos de ~2s, sem reload manual. (UI-only,
    não verificável por teste HTTP puro — precisa de Playwright real.)

