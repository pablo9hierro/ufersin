# `name:` explícito — ver o mesmo comentário em ecommerce/backend/docker-compose.yml
# (as duas pastas se chamam "backend", que é o nome de projeto padrão do
# Docker Compose sem isso, causando colisão de container entre os dois).
name: rodoletas

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5434:5432"
    volumes:
      - rodoletas_pgdata:/var/lib/postgresql/data

volumes:
  rodoletas_pgdata:
