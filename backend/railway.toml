# RAILPACK: Metal Docker builds stick at "scheduling build on Metal builder".
# Keep Dockerfile as Dockerfile.local only so Railway does not auto-select DOCKERFILE.
[build]
builder = "RAILPACK"
watchPatterns = ["src/**", "migrations/**", "Cargo.toml", "Cargo.lock", "railway.toml"]

[deploy]
startCommand = "./target/release/ufersin_backend"
healthcheckPath = "/health"
healthcheckTimeout = 90
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
