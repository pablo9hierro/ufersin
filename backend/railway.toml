# RAILPACK (not DOCKERFILE): Metal Docker builds stick at
# "scheduling build on Metal builder", so production never received
# /api/superadmin/*. Dockerfile is kept as Dockerfile.local / .metal.bak only.
[build]
builder = "RAILPACK"
watchPatterns = ["src/**", "migrations/**", "Cargo.toml", "Cargo.lock", "railway.toml"]
# Ensure cargo release binary exists for startCommand.
buildCommand = "cargo build --release"

[deploy]
startCommand = "./target/release/ufersin_backend"
healthcheckPath = "/health"
healthcheckTimeout = 90
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
