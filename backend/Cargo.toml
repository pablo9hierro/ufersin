[package]
name = "ufersin_backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
argon2 = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tower = "0.5"
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json", "multipart"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
urlencoding = "2"
base64 = "0.22"
utoipa = "5"
utoipa-swagger-ui = { version = "9", features = ["axum"] }
# Validação de certificado digital A1 (.pfx/.p12) -- abre com a senha
# informada e lê a validade antes de repassar ao Jubilados. Nunca
# persistimos o certificado localmente (ver routes/onboarding.rs).
# Usa `openssl` (bindings reais pra libssl, vendored pra não depender de
# OpenSSL do sistema no container) em vez da crate `p12`: `p12` só
# decodifica o esquema legado do PKCS#12 (RC2/3DES) e rejeitava como
# "senha incorreta" certificados exportados por ferramentas atuais
# (OpenSSL 3.x), que usam PBES2/AES-256-CBC -- confirmado testando o
# mesmo arquivo com o binário `openssl` local, que abre normalmente.
openssl = { version = "0.10", features = ["vendored"] }
