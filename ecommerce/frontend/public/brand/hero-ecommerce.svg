<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="35%" stop-color="#3b2a5e"/>
      <stop offset="62%" stop-color="#b6552f"/>
      <stop offset="80%" stop-color="#f2a154"/>
      <stop offset="100%" stop-color="#ffd38a"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3d6" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#ffd38a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffd38a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1225"/>
      <stop offset="100%" stop-color="#0a0710"/>
    </linearGradient>
    <linearGradient id="storeFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#20c76d"/>
      <stop offset="100%" stop-color="#0f7a44"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1180" cy="430" r="230" fill="url(#sun)"/>
  <circle cx="1180" cy="430" r="90" fill="#fff6e2"/>

  <!-- distant skyline silhouette -->
  <g fill="#170f22" opacity="0.9">
    <rect x="0" y="560" width="120" height="180"/>
    <rect x="140" y="500" width="90" height="240"/>
    <rect x="250" y="600" width="140" height="140"/>
    <rect x="1300" y="540" width="110" height="200"/>
    <rect x="1430" y="480" width="90" height="260"/>
    <rect x="1530" y="590" width="70" height="150"/>
  </g>

  <!-- ground -->
  <rect x="0" y="700" width="1600" height="200" fill="url(#ground)"/>
  <ellipse cx="800" cy="820" rx="620" ry="60" fill="#000000" opacity="0.35" filter="url(#soft)"/>

  <!-- storefront building -->
  <g>
    <rect x="560" y="500" width="480" height="300" rx="10" fill="url(#storeFace)"/>
    <rect x="560" y="500" width="480" height="300" rx="10" fill="#000000" opacity="0.08"/>
    <!-- awning -->
    <path d="M540 520 L600 460 H960 L1020 520 Z" fill="#0c4a2b"/>
    <g fill="#ffffff" opacity="0.9">
      <rect x="600" y="460" width="30" height="60"/>
      <rect x="660" y="460" width="30" height="60"/>
      <rect x="720" y="460" width="30" height="60"/>
      <rect x="780" y="460" width="30" height="60"/>
      <rect x="840" y="460" width="30" height="60"/>
      <rect x="900" y="460" width="30" height="60"/>
    </g>
    <!-- door -->
    <rect x="750" y="640" width="100" height="160" rx="6" fill="#0a3320"/>
    <rect x="760" y="650" width="80" height="120" rx="4" fill="#134d31"/>
    <!-- windows -->
    <rect x="600" y="560" width="110" height="120" rx="8" fill="#a7f3d0" opacity="0.85"/>
    <rect x="890" y="560" width="110" height="120" rx="8" fill="#a7f3d0" opacity="0.85"/>
    <!-- sign -->
    <rect x="660" y="380" width="280" height="70" rx="14" fill="#0c4a2b"/>
    <text x="800" y="426" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">RESOLUTOO</text>
  </g>

  <!-- soft warm glow near ground -->
  <ellipse cx="800" cy="700" rx="500" ry="120" fill="#ffb066" opacity="0.12" filter="url(#soft)"/>
</svg>
